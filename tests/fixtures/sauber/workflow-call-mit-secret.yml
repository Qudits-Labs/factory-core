# Fixture, kein aktiver Workflow.
# Ein `workflow_call`-Workflow darf ein Secret deklarieren und verwenden. Der
# Wert kommt vom aufrufenden Repositorium und liegt nie hier.
name: sauber-workflow-call
on:
  workflow_call:
    inputs:
      befehl:
        description: Befehl, den das aufrufende Repositorium ausfuehren laesst
        required: true
        type: string
    secrets:
      agent_token:
        required: true
permissions:
  contents: read
jobs:
  ausfuehren:
    runs-on: ubuntu-latest
    steps:
      - name: Befehl ausfuehren
        env:
          BEFEHL: ${{ inputs.befehl }}
          AGENT_TOKEN: ${{ secrets.agent_token }}
        run: |
          echo "Eingaben stehen in Umgebungsvariablen, nie in der Kommandozeile."
          test -n "$BEFEHL"
