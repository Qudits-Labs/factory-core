# Fixture -- reparierter Stand von transition.yml.
# Beide Anschluss-Defekte behoben:
#   Regel A: Job 'agent' hat einen eigenen permissions-Block, der
#            run-agent.yml's Anforderungen (contents: write,
#            pull-requests: write, issues: write) vollstaendig deckt.
#   Regel B: Jobs 'pruefung' und 'nachbereitung' checken den Kern mit
#            repository: und ref: aus, bevor sie scripts/ aufrufen.

name: Zustandsmaschine -- Uebergang pruefen und ausloesen

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      new_label:
        required: true
        type: string
      actor_login:
        required: true
        type: string
      core_ref:
        description: SHA dieses Repositoriums fuer den Rollenrahmen
        required: true
        type: string
      allowed_bots:
        required: false
        type: string
        default: ''
    secrets:
      transition_token:
        required: true
      anthropic_api_key:
        required: false
      claude_code_oauth_token:
        required: false

permissions:
  issues: write
  contents: read

jobs:
  pruefung:
    name: Zustandsuebergang
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.pruefung.outputs.allowed }}
      role_name: ${{ steps.pruefung.outputs.role_name }}
    steps:
      # Kern auschecken: ohne repository:/ref: wuerde der Checkout im
      # Produktrepo landen -- scripts/ fehlt dort.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Qudits-Labs/factory-core
          ref: ${{ inputs.core_ref }}

      - name: Transition pruefen
        id: pruefung
        env:
          GATE_ACTOR_LOGIN: ${{ inputs.actor_login }}
          GATE_NEW_LABEL: ${{ inputs.new_label }}
        run: python3 scripts/transition_check.py

  agent:
    name: Agenten-Lauf
    needs: pruefung
    if: needs.pruefung.outputs.allowed == 'true'
    # Eigener permissions-Block deckt die Anforderungen von run-agent.yml.
    # Ohne diesen Block galten nur die Workflow-permissions (contents: read),
    # und GitHub lehnte den Aufruf mit startup_failure ab.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: Beispiel-Eigner/Beispiel-Repo/.github/workflows/run-agent.yml@1111111111111111111111111111111111111111
    with:
      core_ref: ${{ inputs.core_ref }}
      allowed_bots: ${{ inputs.allowed_bots }}
    secrets:
      anthropic_api_key: ${{ secrets.anthropic_api_key }}
      claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}

  nachbereitung:
    name: Ergebnis auswerten und Folgezustand bestimmen
    needs: [pruefung, agent]
    if: always() && needs.pruefung.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      next_label: ${{ steps.folge.outputs.next_label }}
    steps:
      # Kern auschecken: run-agent.yml und folgezustand.py liegen im Kern,
      # nicht im Produktrepo.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Qudits-Labs/factory-core
          ref: ${{ inputs.core_ref }}

      - name: Folgezustand bestimmen
        id: folge
        env:
          GATE_NEW_LABEL: ${{ inputs.new_label }}
        run: python3 scripts/folgezustand.py
