# Fixture, kein aktiver Workflow.
# Der Workflow loest selbst aus und verwendet trotzdem ein Secret. Damit
# muesste in diesem Repositorium eines hinterlegt sein. Die Pruefung schlaegt an.
name: verstoss-offenes-secret
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gefaehrlich:
    runs-on: ubuntu-latest
    steps:
      - name: Secret verwenden
        env:
          WERT: ${{ secrets.IRGENDEIN_TOKEN }}
        run: test -n "$WERT"
