name: G3 Spec-Review (Adversary)

# Laedt den Adversary-Agenten, um eine Spezifikation zu pruefen.
# Ruft run-agent.yml mit role: adversary auf und wertet result.json aus.
#
# Drei-Job-Struktur:
#   vorbereitung  -- Checkout, optionale Spec-Datei als Kontext-String laden
#   agent         -- Aufruf von run-agent.yml auf Job-Ebene
#   auswertung    -- Ergebnis auswerten, Pass/Fail bestimmen
#
# UNGETESTET -- dieser Workflow laeuft erst mit der ersten echten Anbindung
# eines Produktrepos und einer genehmigten GitHub App. Bis dahin ist er
# nicht end-to-end pruefbar.
#
# Fremde Actions sind auf einen Commit-SHA gepinnt.

on:
  workflow_call:
    inputs:
      issue_number:
        description: Nummer des Issues mit der zu pruefenden Spezifikation
        required: true
        type: number
      spec_path:
        description: Pfad zur Spezifikationsdatei (wird dem Agenten als Kontext mitgegeben)
        required: false
        type: string
        default: ''
      max_turns:
        description: Maximale Anzahl Agenten-Turns
        required: false
        type: number
        default: 20
      allowed_bots:
        description: >
          Komma-getrennte Login-Namen erlaubter Bot-Accounts. In einer Kette,
          in der ein Agent den naechsten anstoesst, ist der Ausloeser ein Bot;
          ohne Eintrag hier weist die Action den Lauf ab.
        required: false
        type: string
        default: ''
      core_ref:
        description: SHA dieses Repositoriums fuer den Rollenrahmen
        required: true
        type: string
    outputs:
      pass:
        description: true wenn der Review keine kritischen Befunde ergab
        value: ${{ jobs.auswertung.outputs.pass }}
      findings_json:
        description: JSON-Array der Befunde aus result.json
        value: ${{ jobs.auswertung.outputs.findings_json }}
    secrets:
      anthropic_api_key:
        description: >
          Anthropic API-Schluessel fuer den Agentenlauf. Genau eines von
          anthropic_api_key und claude_code_oauth_token muss gesetzt sein.
        required: false
      claude_code_oauth_token:
        description: >
          OAuth-Token eines Claude-Abos fuer den Agentenlauf. Genau eines von
          claude_code_oauth_token und anthropic_api_key muss gesetzt sein.
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Spec-Datei als Kontext-String aufbereiten
  # ---------------------------------------------------------------------------
  vorbereitung:
    name: Spec-Erweiterung vorbereiten
    runs-on: ubuntu-latest
    outputs:
      prompt_extension: ${{ steps.spec.outputs.prompt_extension }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # Schritt 1: Optionale Spec-Datei lesen und als Multiline-String ausgeben.
      # Leerer spec_path ergibt einen leeren prompt_extension-Output.
      # -----------------------------------------------------------------------
      - name: Spec-Erweiterung vorbereiten
        id: spec
        env:
          GATE_SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          python3 - << 'PYEOF'
          import os
          import sys
          from pathlib import Path

          pfad_str = os.environ.get("GATE_SPEC_PATH", "").strip()
          github_output = os.environ.get("GITHUB_OUTPUT", "")
          DELIMITER = "FACTORY_EOF"

          def schreibe_multiline(k, inhalt):
              if not github_output:
                  return
              if DELIMITER in inhalt:
                  print(
                      f"FEHLER: Delimiter '{DELIMITER}' kommt im Spec-Inhalt vor.",
                      file=sys.stderr,
                  )
                  sys.exit(2)
              with open(github_output, "a") as f:
                  f.write(f"{k}<<{DELIMITER}\n{inhalt}\n{DELIMITER}\n")

          if not pfad_str:
              schreibe_multiline("prompt_extension", "")
              print("Kein spec_path angegeben -- leere Erweiterung.")
              sys.exit(0)

          pfad = Path(pfad_str)
          if not pfad.exists():
              print(f"WARNUNG: spec_path '{pfad}' nicht gefunden, wird ignoriert.")
              schreibe_multiline("prompt_extension", "")
              sys.exit(0)

          inhalt = (
              "## Zu pruefende Spezifikation\n\n"
              f"Datei: `{pfad}`\n\n"
              + pfad.read_text(encoding="utf-8")
          )
          schreibe_multiline("prompt_extension", inhalt)
          print(f"Spec-Erweiterung geschrieben: {len(inhalt)} Zeichen")
          PYEOF

  # ---------------------------------------------------------------------------
  # Job 2: Agentenlauf (Adversary)
  # Ein wiederverwendbarer Workflow wird auf Job-Ebene eingebunden.
  #
  # Vollform mit Commit-SHA statt `./...` -- die Begruendung steht in
  # transition.yml beim gleichnamigen Job. Kurzfassung: fuer den Aufruf ueber
  # Repositoriumsgrenzen legt die GitHub-Dokumentation die Aufloesung der
  # Kurzform nicht fest, und ein Zweigname waere beweglich. Der Canary misst
  # diesen Zeiger gegen den Arbeitsstand (Schritt 11).
  # ---------------------------------------------------------------------------
  agent:
    name: Agentenlauf (Adversary)
    needs: vorbereitung
    uses: Qudits-Labs/factory-core/.github/workflows/run-agent.yml@12d2bf2ead99a71ca31584fcf6052c87fe5b6b38
    with:
      role: adversary
      issue_number: ${{ inputs.issue_number }}
      prompt_extension: ${{ needs.vorbereitung.outputs.prompt_extension }}
      max_turns: ${{ inputs.max_turns }}
      allowed_bots: ${{ inputs.allowed_bots }}
      core_ref: ${{ inputs.core_ref }}
    secrets:
      anthropic_api_key: ${{ secrets.anthropic_api_key }}
      claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}

  # ---------------------------------------------------------------------------
  # Job 3: Ergebnis auswerten
  # ---------------------------------------------------------------------------
  auswertung:
    name: Agentenlauf auswerten
    needs: agent
    if: always()
    runs-on: ubuntu-latest
    outputs:
      pass: ${{ steps.auswertung.outputs.pass }}
      findings_json: ${{ steps.auswertung.outputs.findings_json }}
    steps:
      - name: Agentenlauf auswerten
        id: auswertung
        env:
          GATE_RESULT_JSON: ${{ needs.agent.outputs.result_json }}
          GATE_SCHEMA_VALID: ${{ needs.agent.outputs.schema_valid }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import sys

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          def schreibe(k, v):
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"{k}={v}\n")

          schema_valid = os.environ.get("GATE_SCHEMA_VALID", "false") == "true"
          if not schema_valid:
              schreibe("pass", "false")
              schreibe("findings_json", json.dumps(["Agentenlauf fehlgeschlagen oder Schema ungueltig"]))
              sys.exit(1)

          try:
              ergebnis = json.loads(os.environ.get("GATE_RESULT_JSON", "{}"))
          except json.JSONDecodeError:
              schreibe("pass", "false")
              schreibe("findings_json", json.dumps(["result.json konnte nicht geparst werden"]))
              sys.exit(1)

          befunde = ergebnis.get("findings", [])
          kritisch = [b for b in befunde if isinstance(b, dict) and b.get("severity") == "BLOCK"]
          bestanden = len(kritisch) == 0

          schreibe("pass", "true" if bestanden else "false")
          schreibe("findings_json", json.dumps(befunde))

          if not bestanden:
              print(f"{len(kritisch)} kritische Befunde (BLOCK). Review nicht bestanden.", file=sys.stderr)
              sys.exit(1)

          print(f"Spec-Review bestanden. {len(befunde)} Befund(e) gesamt, keine kritischen.")
          PYEOF
