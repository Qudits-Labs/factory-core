name: G3 Spec-Review (Adversary)

# Laedt den Adversary-Agenten, um eine Spezifikation zu pruefen.
# Ruft run-agent.yml mit role: adversary auf und wertet result.json aus.
#
# UNGETESTET -- dieser Workflow laeuft erst mit der ersten echten Anbindung
# eines Produktrepos und einer genehmigten GitHub App. Bis dahin ist er
# nicht end-to-end pruefbar.
#
# Fremde Actions sind auf einen Commit-SHA gepinnt.

on:
  workflow_call:
    inputs:
      issue_number:
        description: Nummer des Issues mit der zu pruefenden Spezifikation
        required: true
        type: number
      spec_path:
        description: Pfad zur Spezifikationsdatei (wird dem Agenten als Kontext mitgegeben)
        required: false
        type: string
        default: ''
      max_turns:
        description: Maximale Anzahl Agenten-Turns
        required: false
        type: number
        default: 20
      action_sha:
        description: Commit-SHA der claude-code-action
        required: true
        type: string
      core_ref:
        description: SHA dieses Repositoriums fuer den Rollenrahmen
        required: true
        type: string
    outputs:
      pass:
        description: true wenn der Review keine kritischen Befunde ergab
        value: ${{ jobs.specreview.outputs.pass }}
      findings_json:
        description: JSON-Array der Befunde aus result.json
        value: ${{ jobs.specreview.outputs.findings_json }}
    secrets:
      anthropic_api_key:
        description: Anthropic API-Schluessel fuer den Agentenlauf
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  specreview:
    name: Spec-Review (Adversary)
    runs-on: ubuntu-latest
    outputs:
      pass: ${{ steps.auswertung.outputs.pass }}
      findings_json: ${{ steps.auswertung.outputs.findings_json }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Optionale Spec-Datei als Kontext-Erweiterung vorbereiten
      - name: Spec-Erweiterung vorbereiten
        if: inputs.spec_path != ''
        env:
          GATE_SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          python3 - << 'PYEOF'
          import os
          import sys
          from pathlib import Path

          pfad = Path(os.environ.get("GATE_SPEC_PATH", ""))
          if not pfad.exists():
              print(f"WARNUNG: spec_path '{pfad}' nicht gefunden, wird ignoriert.")
              sys.exit(0)

          erweiterung = Path("/tmp/spec_extension.md")
          inhalt = (
              f"## Zu pruefende Spezifikation\n\n"
              f"Datei: `{pfad}`\n\n"
              + pfad.read_text(encoding="utf-8")
          )
          erweiterung.write_text(inhalt, encoding="utf-8")
          print(f"Spec-Erweiterung geschrieben: {len(inhalt)} Zeichen")
          PYEOF

      - name: Agentenlauf (Adversary)
        id: agent
        uses: ./.github/workflows/run-agent.yml
        with:
          role: adversary
          issue_number: ${{ inputs.issue_number }}
          prompt_extension_path: ${{ inputs.spec_path != '' && '/tmp/spec_extension.md' || '' }}
          max_turns: ${{ inputs.max_turns }}
          action_sha: ${{ inputs.action_sha }}
          core_ref: ${{ inputs.core_ref }}
        secrets:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}

      - name: Agentenlauf auswerten
        id: auswertung
        if: always()
        env:
          GATE_RESULT_JSON: ${{ steps.agent.outputs.result_json }}
          GATE_SCHEMA_VALID: ${{ steps.agent.outputs.schema_valid }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import sys

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          def schreibe(k, v):
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"{k}={v}\n")

          schema_valid = os.environ.get("GATE_SCHEMA_VALID", "false") == "true"
          if not schema_valid:
              schreibe("pass", "false")
              schreibe("findings_json", json.dumps(["Agentenlauf fehlgeschlagen oder Schema ungueltig"]))
              sys.exit(1)

          try:
              ergebnis = json.loads(os.environ.get("GATE_RESULT_JSON", "{}"))
          except json.JSONDecodeError:
              schreibe("pass", "false")
              schreibe("findings_json", json.dumps(["result.json konnte nicht geparst werden"]))
              sys.exit(1)

          befunde = ergebnis.get("findings", [])
          kritisch = [b for b in befunde if isinstance(b, dict) and b.get("severity") == "BLOCK"]
          bestanden = len(kritisch) == 0

          schreibe("pass", "true" if bestanden else "false")
          schreibe("findings_json", json.dumps(befunde))

          if not bestanden:
              print(f"{len(kritisch)} kritische Befunde (BLOCK). Review nicht bestanden.", file=sys.stderr)
              sys.exit(1)

          print(f"Spec-Review bestanden. {len(befunde)} Befund(e) gesamt, keine kritischen.")
          PYEOF
