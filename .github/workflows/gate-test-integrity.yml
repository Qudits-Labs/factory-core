name: G7 Testdatei-Integritaet pruefen

# Schuetzt geschuetzte Testpfade vor stillschweigender Anpassung.
# Fehlt die Baseline, endet der Workflow mit Fehler -- nie mit stillem PASS.
#
# Muster B: Der Produktcode liegt im Arbeitsverzeichnis, der Kern wird nach
# RUNNER_TEMP/factory-core verschoben. FACTORY_CORE_DIR steht danach in allen
# Schritten zur Verfuegung.
#
# Fremde Actions sind auf einen Commit-SHA gepinnt.

on:
  workflow_call:
    inputs:
      baseline_sha:
        description: >
          Baseline-Commit-SHA. Wird dieses Feld leer uebergeben, bricht der
          Workflow ab -- eine unbekannte Baseline ist ein Fehler, kein PASS.
        required: true
        type: string
      head_sha:
        description: Head-Commit-SHA
        required: true
        type: string
      protected_paths:
        description: Komma-getrennte Glob-Muster fuer geschuetzte Pfade
        required: true
        type: string
      core_ref:
        description: SHA dieses Repositoriums fuer den Kern
        required: true
        type: string
    outputs:
      pass:
        description: true wenn keine geschuetzten Dateien geaendert wurden
        value: ${{ jobs.integritaet.outputs.pass }}
      changed_files:
        description: JSON-Array der geaenderten Dateien im Diff
        value: ${{ jobs.integritaet.outputs.changed_files }}
      findings_json:
        description: JSON-Array der Verletzungen
        value: ${{ jobs.integritaet.outputs.findings_json }}

permissions:
  contents: read

jobs:
  integritaet:
    name: Testdatei-Integritaet
    runs-on: ubuntu-latest
    outputs:
      pass: ${{ steps.pruefung.outputs.pass }}
      changed_files: ${{ steps.pruefung.outputs.changed_files }}
      findings_json: ${{ steps.pruefung.outputs.findings_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Qudits-Labs/factory-core
          ref: ${{ inputs.core_ref }}
          path: .factory-core
          persist-credentials: false
      - name: Kern-Verzeichnis verschieben
        run: |
          mv .factory-core "$RUNNER_TEMP/factory-core"
          echo "FACTORY_CORE_DIR=$RUNNER_TEMP/factory-core" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Testdatei-Integritaet pruefen
        id: pruefung
        env:
          GATE_BASELINE_SHA: ${{ inputs.baseline_sha }}
          GATE_HEAD_SHA: ${{ inputs.head_sha }}
          GATE_PROTECTED_PATHS: ${{ inputs.protected_paths }}
        run: python3 "$FACTORY_CORE_DIR/scripts/gate_test_integrity.py"
