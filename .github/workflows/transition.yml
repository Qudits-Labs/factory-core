name: Zustandsmaschine -- Uebergang pruefen und ausloesen

# Verwaltet Zustandsuebergaenge in der Factory-Pipeline.
# Prueft Akteur-Berechtigung, Vorbedingungen und Versuchszaehlung,
# schreibt einen Attempt-Eintrag ins Issue, startet den Agentenlauf
# und setzt anschliessend das naechste Label.
#
# Drei-Job-Struktur:
#   pruefung      -- Akteur-Check, Unauthorized-Zweig, Attempt-Eintrag
#   agent         -- Aufruf von run-agent.yml auf Job-Ebene (nur bei allowed)
#   nachbereitung -- Ergebnis pruefen, naechstes Label setzen
#
# UNGETESTET -- dieser Workflow laeuft erst mit der ersten echten Anbindung
# eines Produktrepos und einer genehmigten GitHub App. Bis dahin ist er
# nicht end-to-end pruefbar.
#
# Sicherheitsauflage: role_label_map_json bildet Labels auf Rollennamen ab,
# nicht auf Workflow-Pfade. Nur die sechs definierten Rollennamen sind als
# Werte erlaubt. Ein freier Pfad als Wert wuerde die Zustandsmaschine
# umleitbar machen.
#
# ---------------------------------------------------------------------------
# Was dieser Ablauf nach einem Lauf tut -- und was ausdruecklich nicht
#
# Er bestimmt den Folgezustand und gibt ihn als Ausgabe `next_label` zurueck.
# Gesetzt wird das Label hier nicht. Ein Label, das mit dem Token dieses
# Ablaufs gesetzt wird, loest keinen weiteren Workflow aus; die Kette bliebe
# trotz richtigem Folgezustand stehen. Setzen muss es eine Identitaet, die
# Folgeereignisse ausloest -- in aller Regel eine GitHub App. Deren Token
# entsteht zur Laufzeit und ueberlebt keinen Job-Output: der Runner ersetzt
# einen maskierten Wert durch eine leere Zeichenkette. Es muss also in dem
# Job erzeugt und verwendet werden, in dem es gebraucht wird, und dieser Job
# liegt im aufrufenden Repositorium.
#
# Die Arbeitsteilung ist damit: dieser Ablauf prueft, zaehlt, laesst den
# Agenten laufen und sagt, was als naechstes gilt. Der Aufrufer setzt es.
#
# Bei unberechtigtem Akteur:
#   - Label wird zurueckgesetzt
#   - Kommentar mit Rolle, Zeitpunkt und Run-ID wird ins Issue geschrieben
#   - Label flag:unauthorized-transition wird gesetzt
#
# Fremde Actions sind auf einen Commit-SHA gepinnt.

on:
  workflow_call:
    inputs:
      issue_number:
        description: Nummer des Issues, das den Uebergang ausloest
        required: true
        type: number
      new_label:
        description: Ziel-Label des Uebergangs
        required: true
        type: string
      actor_login:
        description: GitHub-Login des ausloesenden Akteurs
        required: true
        type: string
      human_gate_logins:
        description: Komma-getrennte Logins fuer menschliche Eingriffe
        required: true
        type: string
      transition_identity_login:
        description: Login der Transition-Identitaet (Factory-Bot)
        required: true
        type: string
      role_label_map_json:
        description: >
          JSON-Objekt: Label -> Rollenname (nicht Pfad!).
          Erlaubte Werte: intake-coordinator, solution-architect,
          test-designer, implementer, adversary, deployer.
          Leer laesst die Standardtabelle des Kerns gelten.
        required: false
        type: string
        default: ''
      folge_label_map_json:
        description: >
          JSON-Objekt: Label -> Folgezustand. Leer laesst die Standardfolge
          des Kerns gelten. Eine uebergebene Tabelle ersetzt sie vollstaendig.
        required: false
        type: string
        default: ''
      max_attempts:
        description: Maximale Anzahl Agenten-Versuche pro Issue
        required: false
        type: number
        default: 3
      max_turns:
        description: Maximale Anzahl Agenten-Turns je Lauf
        required: false
        type: number
        default: 20
      prompt_extension:
        description: >
          Optionale Prompt-Erweiterung, die an den Rollenrahmen angehaengt
          wird. Kommt als Zeichenkette, nicht als Dateipfad.
        required: false
        type: string
        default: ''
      allowed_bots:
        description: >
          Komma-getrennte Login-Namen erlaubter Bot-Accounts. In einer Kette,
          in der ein Agent den naechsten anstoesst, ist der Ausloeser ein Bot;
          ohne Eintrag hier weist die Action den Lauf ab.
        required: false
        type: string
        default: ''
      core_ref:
        description: SHA dieses Repositoriums fuer den Rollenrahmen
        required: true
        type: string
    outputs:
      allowed:
        description: true wenn der Uebergang erlaubt war
        value: ${{ jobs.pruefung.outputs.allowed }}
      role_name:
        description: Rollenname fuer das Ziel-Label
        value: ${{ jobs.pruefung.outputs.role_name }}
      agent_status:
        description: Ergebnis des Agentenlaufs
        value: ${{ jobs.nachbereitung.outputs.status }}
      next_label:
        description: >
          Das Label, das nach einem erfolgreichen Lauf gilt. Leer heisst:
          die Kette haelt hier an. Setzen muss es der Aufrufer -- siehe die
          Notiz zur Arbeitsteilung im Kopf dieser Datei.
        value: ${{ jobs.nachbereitung.outputs.next_label }}
    secrets:
      transition_token:
        description: >
          GitHub-Token fuer Kommentare und das Zuruecksetzen eines Labels bei
          unberechtigtem Akteur. Das Standardtoken des Aufrufers genuegt und
          ist hier die richtige Wahl: diese Schreibvorgaenge sollen
          ausdruecklich keinen weiteren Workflow ausloesen.
        required: true
      anthropic_api_key:
        description: >
          Anthropic API-Schluessel fuer den Agentenlauf. Genau eines von
          anthropic_api_key und claude_code_oauth_token muss gesetzt sein.
        required: false
      claude_code_oauth_token:
        description: >
          OAuth-Token eines Claude-Abos fuer den Agentenlauf. Genau eines von
          claude_code_oauth_token und anthropic_api_key muss gesetzt sein.
        required: false

permissions:
  issues: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Akteur-Berechtigung pruefen, Unauthorized behandeln, Attempt schreiben
  # ---------------------------------------------------------------------------
  pruefung:
    name: Zustandsuebergang (${{ inputs.new_label }})
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.pruefung.outputs.allowed }}
      role_name: ${{ steps.pruefung.outputs.role_name }}
      human_intervention: ${{ steps.pruefung.outputs.human_intervention }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # Schritt 1: Akteur und Vorbedingungen pruefen
      # -----------------------------------------------------------------------
      - name: Transition pruefen
        id: pruefung
        env:
          GATE_ACTOR_LOGIN: ${{ inputs.actor_login }}
          GATE_TRANSITION_IDENTITY_LOGIN: ${{ inputs.transition_identity_login }}
          GATE_HUMAN_GATE_LOGINS: ${{ inputs.human_gate_logins }}
          GATE_NEW_LABEL: ${{ inputs.new_label }}
          GATE_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          GATE_ROLE_LABEL_MAP_JSON: ${{ inputs.role_label_map_json }}
          GATE_CURRENT_ATTEMPTS: '0'
        run: python3 scripts/transition_check.py

      # -----------------------------------------------------------------------
      # Schritt 2: Bei unberechtigtem Akteur -- Label zuruecksetzen, flaggen
      # -----------------------------------------------------------------------
      - name: Unauthorized-Transition behandeln
        if: steps.pruefung.outputs.allowed == 'false'
        env:
          GH_TOKEN: ${{ secrets.transition_token }}
          GATE_ISSUE: ${{ inputs.issue_number }}
          GATE_NEW_LABEL: ${{ inputs.new_label }}
          GATE_ACTOR: ${{ inputs.actor_login }}
          GATE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import os
          import subprocess

          issue = os.environ["GATE_ISSUE"]
          label = os.environ["GATE_NEW_LABEL"]
          actor = os.environ["GATE_ACTOR"]
          run_id = os.environ["GATE_RUN_ID"]
          token = os.environ["GH_TOKEN"]

          # Kommentar mit Erklaerung setzen
          kommentar = (
              f"<!-- factory:unauthorized -->\n"
              f"**Abgewiesener Uebergang** (Run {run_id})\n\n"
              f"Akteur `{actor}` ist nicht berechtigt, Label `{label}` zu setzen.\n"
              f"Berechtigte Logins: Transition-Identitaet oder Human-Gate-Logins.\n"
          )
          subprocess.run(
              ["gh", "issue", "comment", issue, "--body", kommentar],
              check=True,
              env={**os.environ, "GH_TOKEN": token},
          )

          # Flag setzen
          subprocess.run(
              ["gh", "issue", "edit", issue, "--add-label", "flag:unauthorized-transition"],
              check=False,
              env={**os.environ, "GH_TOKEN": token},
          )

          # Ziel-Label entfernen (wurde eventuell schon gesetzt)
          subprocess.run(
              ["gh", "issue", "edit", issue, "--remove-label", label],
              check=False,
              env={**os.environ, "GH_TOKEN": token},
          )
          PYEOF

      # -----------------------------------------------------------------------
      # Schritt 3: Attempt-Eintrag VOR dem Agentenlauf ins Issue schreiben
      # -----------------------------------------------------------------------
      - name: Attempt-Eintrag schreiben
        if: steps.pruefung.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.transition_token }}
          GATE_ISSUE: ${{ inputs.issue_number }}
          GATE_ROLE: ${{ steps.pruefung.outputs.role_name }}
          GATE_RUN_ID: ${{ github.run_id }}
          GATE_ACTOR: ${{ inputs.actor_login }}
          GATE_HUMAN: ${{ steps.pruefung.outputs.human_intervention }}
        run: |
          python3 - << 'PYEOF'
          import os
          import subprocess
          from datetime import datetime, timezone

          issue = os.environ["GATE_ISSUE"]
          rolle = os.environ["GATE_ROLE"]
          run_id = os.environ["GATE_RUN_ID"]
          actor = os.environ["GATE_ACTOR"]
          ist_mensch = os.environ.get("GATE_HUMAN", "false") == "true"
          token = os.environ["GH_TOKEN"]

          zeitstempel = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          art = "menschlicher Eingriff" if ist_mensch else "automatisch"
          kommentar = (
              f"<!-- factory:attempt run={run_id} -->\n"
              f"**Agentenlauf gestartet** ({art})\n\n"
              f"| Feld | Wert |\n"
              f"|------|------|\n"
              f"| Rolle | `{rolle}` |\n"
              f"| Akteur | `{actor}` |\n"
              f"| Zeitstempel | {zeitstempel} |\n"
              f"| Run-ID | {run_id} |\n"
          )
          subprocess.run(
              ["gh", "issue", "comment", issue, "--body", kommentar],
              check=True,
              env={**os.environ, "GH_TOKEN": token},
          )
          print(f"Attempt-Eintrag gesetzt fuer Run {run_id}")
          PYEOF

  # ---------------------------------------------------------------------------
  # Job 2: Agentenlauf -- nur wenn der Uebergang erlaubt ist
  # Ein wiederverwendbarer Workflow wird auf Job-Ebene eingebunden.
  #
  # Vollform statt `./.github/workflows/run-agent.yml`: Dieser Ablauf wird ueber
  # Repositoriumsgrenzen hinweg aufgerufen. Die GitHub-Dokumentation beschreibt
  # `./` als Form fuer einen Aufruf innerhalb desselben Repositoriums -- der
  # aufgerufene Ablauf stammt dann aus demselben Commit wie der aufrufende. Fuer
  # den verschachtelten Aufruf ueber Repositoriumsgrenzen sagt sie nicht, worauf
  # sich das bezieht. Die Vollform ist belegbar, die Kurzform nur wahrscheinlich.
  #
  # Der SHA zeigt auf den Commit, der die hier gueltige Fassung von
  # run-agent.yml eingefuehrt hat. Ein Zweigname stuende bequemer, wuerde aber
  # die Zusage dieses Repositoriums brechen: ein Produktrepositorium pinnt
  # diesen Kern auf einen SHA und bekaeme ueber einen beweglichen inneren
  # Zeiger doch wieder eine wechselnde Fassung untergeschoben.
  #
  # Der Preis ist ein zweiter Commit, wenn run-agent.yml sich aendert: erst die
  # Aenderung, dann der Zeiger darauf. Damit ein vergessener zweiter Commit
  # nicht unbemerkt bleibt, misst der Canary diesen Zeiger gegen den
  # Arbeitsstand -- canary/run_canary.py, Schritt 11.
  # ---------------------------------------------------------------------------
  agent:
    name: Agenten-Lauf
    needs: pruefung
    if: needs.pruefung.outputs.allowed == 'true'
    uses: Qudits-Labs/factory-core/.github/workflows/run-agent.yml@12d2bf2ead99a71ca31584fcf6052c87fe5b6b38
    with:
      role: ${{ needs.pruefung.outputs.role_name }}
      issue_number: ${{ inputs.issue_number }}
      core_ref: ${{ inputs.core_ref }}
      max_turns: ${{ inputs.max_turns }}
      prompt_extension: ${{ inputs.prompt_extension }}
      allowed_bots: ${{ inputs.allowed_bots }}
    secrets:
      anthropic_api_key: ${{ secrets.anthropic_api_key }}
      claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}

  # ---------------------------------------------------------------------------
  # Job 3: Ergebnis pruefen und den Folgezustand bestimmen
  #
  # Bis hierher galt: nach einem Lauf wurde dasselbe Label erneut gesetzt, das
  # ihn ausgeloest hatte. Das ruecke die Zustandsmaschine nicht vor -- die
  # Kette lief einen Schritt und blieb stehen. Jetzt wird der Folgezustand
  # nachgeschlagen und als Ausgabe zurueckgegeben; gesetzt wird er vom
  # Aufrufer mit einer Identitaet, die Folgeereignisse ausloest.
  # ---------------------------------------------------------------------------
  nachbereitung:
    name: Ergebnis auswerten und Folgezustand bestimmen
    needs: [pruefung, agent]
    if: always() && needs.pruefung.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.agent_ergebnis.outputs.status }}
      next_label: ${{ steps.folge.outputs.next_label }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Ergebnis auswerten
        id: agent_ergebnis
        env:
          GH_TOKEN: ${{ secrets.transition_token }}
          GATE_ISSUE: ${{ inputs.issue_number }}
          GATE_NEW_LABEL: ${{ inputs.new_label }}
          GATE_AGENT_STATUS: ${{ needs.agent.outputs.status || 'agent_error' }}
          GATE_SCHEMA_VALID: ${{ needs.agent.outputs.schema_valid || 'false' }}
          GATE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import os
          import subprocess
          import sys

          issue = os.environ["GATE_ISSUE"]
          label = os.environ["GATE_NEW_LABEL"]
          agent_status = os.environ["GATE_AGENT_STATUS"]
          schema_valid = os.environ["GATE_SCHEMA_VALID"] == "true"
          run_id = os.environ["GATE_RUN_ID"]
          token = os.environ["GH_TOKEN"]

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          def schreibe(k, v):
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"{k}={v}\n")

          if agent_status != "success" or not schema_valid:
              status = "schema_invalid" if not schema_valid else "agent_error"
              schreibe("status", status)
              kommentar = (
                  f"<!-- factory:result run={run_id} status={status} -->\n"
                  f"**Agentenlauf fehlgeschlagen** (Run {run_id})\n\n"
                  f"Status: `{status}` | Schema gueltig: `{schema_valid}`\n"
              )
              subprocess.run(
                  ["gh", "issue", "comment", issue, "--body", kommentar],
                  check=False,
                  env={**os.environ, "GH_TOKEN": token},
              )
              sys.exit(1)

          schreibe("status", "success")
          print(f"Lauf zu Label '{label}' erfolgreich abgeschlossen.")
          PYEOF

      # -----------------------------------------------------------------------
      # Folgezustand nachschlagen und als Ausgabe zurueckgeben.
      #
      # Ohne uebergebene Tabelle gilt die Standardfolge aus
      # scripts/factory_phasen.py. Ein leerer Wert ist kein Fehler: an einem
      # menschlichen Gate und am Ende der Kette gibt es keinen Folgezustand.
      # -----------------------------------------------------------------------
      - name: Folgezustand bestimmen
        id: folge
        if: steps.agent_ergebnis.outputs.status == 'success'
        env:
          GATE_NEW_LABEL: ${{ inputs.new_label }}
          GATE_FOLGE_LABEL_MAP_JSON: ${{ inputs.folge_label_map_json }}
        run: python3 scripts/folgezustand.py

      # -----------------------------------------------------------------------
      # Den Stand ins Issue schreiben. Ein Kommentar ist kein Label und loest
      # nichts aus -- er macht nur nachvollziehbar, was als naechstes gilt und
      # wer es zu setzen hat.
      # -----------------------------------------------------------------------
      - name: Ergebnis ins Issue schreiben
        if: steps.agent_ergebnis.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.transition_token }}
          GATE_ISSUE: ${{ inputs.issue_number }}
          GATE_NEW_LABEL: ${{ inputs.new_label }}
          GATE_NEXT_LABEL: ${{ steps.folge.outputs.next_label }}
          GATE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import os
          import subprocess

          issue = os.environ["GATE_ISSUE"]
          label = os.environ["GATE_NEW_LABEL"]
          folge = os.environ.get("GATE_NEXT_LABEL", "").strip()
          run_id = os.environ["GATE_RUN_ID"]
          token = os.environ["GH_TOKEN"]

          if folge:
              naechster = (
                  f"Naechster Zustand: `{folge}`. Gesetzt wird er vom "
                  f"aufrufenden Ablauf.\n"
              )
          else:
              naechster = (
                  "Fuer diesen Zustand ist kein Folgezustand hinterlegt. "
                  "Die Kette haelt hier an.\n"
              )

          kommentar = (
              f"<!-- factory:result run={run_id} status=success -->\n"
              f"**Agentenlauf abgeschlossen** (Run {run_id})\n\n"
              f"Erledigter Zustand: `{label}`\n\n"
              f"{naechster}"
          )
          subprocess.run(
              ["gh", "issue", "comment", issue, "--body", kommentar],
              check=False,
              env={**os.environ, "GH_TOKEN": token},
          )
          PYEOF
