name: Selbstpruefung

# Dieses Repository ist oeffentlich. `pull_request` fuehrt einen Fremdbeitrag im
# Kontext des Forks aus, ohne Schreibtoken und ohne Secrets. `pull_request_target`
# wuerde das Gegenteil tun; der Job `ausloeser` weist ihn zurueck.
#
# Fremde Actions sind auf einen Commit-SHA gepinnt. Ein Tag laesst sich
# verschieben, ein SHA nicht.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ausloeser:
    name: Verbotene Workflow-Ausloeser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: PyYAML installieren
        run: pip install --quiet pyyaml
      - name: Ausloeser pruefen
        run: python3 scripts/check_workflow_triggers.py .github/workflows

  secrets:
    name: Keine offene Secret-Referenz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: PyYAML installieren
        run: pip install --quiet pyyaml
      - name: Secret-Referenzen pruefen
        run: python3 scripts/check_no_secrets.py .github/workflows

  eigenpruefung:
    name: Pruefskripte gegen Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten installieren
        run: pip install --quiet pyyaml jsonschema referencing
      - name: Fixtures pruefen
        run: python3 scripts/selftest.py

  workflow-struktur:
    name: Workflow-Struktur (uses-Ausdruecke, Reusable-als-Step)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: PyYAML installieren
        run: pip install --quiet pyyaml
      - name: Workflow-Struktur pruefen
        run: python3 scripts/check_workflow_struktur.py .github/workflows

  schemas:
    name: Schemas, Beispiele und Gegenproben
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten installieren
        run: pip install --quiet pyyaml jsonschema referencing
      - name: Schemas pruefen
        run: python3 scripts/validate_schemas.py
